<footer
  class="relative z-0 mt-16 rounded-t-3xl border border-b-0 border-base-300 bg-base-100/80 backdrop-blur-sm sm:mt-25 md:rounded-t-2xl"
>
  <div class="grid grid-cols-1 gap-6 px-6 py-4 sm:py-6 md:grid-cols-4">
    <div class="md:col-span-2">
      <h4 class="mb-2 text-sm font-semibold opacity-90">Koala</h4>
      <p class="text-sm leading-relaxed opacity-70">
        {{ copy().footer.description }}
      </p>
    </div>

    <div>
      <h4 class="mb-2 text-sm font-semibold opacity-90">{{ copy().footer.libraries }}</h4>
      <ul class="space-y-1 text-sm opacity-80">
        <li>
          <a
            href="https://ui.koalarx.com"
            target="_blank"
            rel="noopener noreferrer"
            class="inline-flex items-center gap-2 text-sm opacity-80 transition-opacity hover:opacity-100"
          >
            Koala UI
            <i class="fa-solid fa-arrow-up-long rotate-45 text-[0.6rem]"></i>
          </a>
        </li>
        <li>
          <a
            href="https://nest.koalarx.com"
            target="_blank"
            rel="noopener noreferrer"
            class="inline-flex items-center gap-2 text-sm opacity-80 transition-opacity hover:opacity-100"
          >
            Koala Nest
            <i class="fa-solid fa-arrow-up-long rotate-45 text-[0.6rem]"></i>
          </a>
        </li>
        <li>
          <a
            href="https://utils.koalarx.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="inline-flex items-center gap-2 text-sm opacity-80 transition-opacity hover:opacity-100"
          >
            Koala Utils
            <i class="fa-solid fa-arrow-up-long rotate-45 text-[0.6rem]"></i>
          </a>
        </li>
      </ul>
    </div>

    <div>
      <h4 class="mb-2 text-sm font-semibold opacity-90">{{ copy().footer.creator }}</h4>
      <a
        href="https://igordrangel.com.br/"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2 text-sm opacity-80 transition-opacity hover:opacity-100"
      >
        igordrangel.com.br
        <i class="fa-solid fa-arrow-up-long rotate-45 text-[0.6rem]"></i>
      </a>
      <p class="mt-2 text-xs opacity-60">{{ copy().footer.creatorRole }}</p>
    </div>
  </div>

  <div
    class="flex flex-col items-center gap-4 border-t border-base-300 px-6 py-4 text-center text-xs opacity-60 md:flex-row md:items-center md:justify-between md:gap-6 md:py-3 md:text-left"
  >
    <span class="md:text-left">{{ copy().footer.copyright }}</span>
    <span class="md:text-right">{{ copy().footer.tagline }}</span>
  </div>
</footer>
