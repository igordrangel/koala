@if (config(); as config) {
  @switch (config.type) {
    @case ('calendar') {
      <app-input-calendar
        #calendarField
        format="dd/MM/yyyy"
        [(value)]="value"
        [placeholder]="config.placeholder ?? 'Select a date'"
        (valueChange)="valueControl.setValue($event)"
        inline
      />
    }
  }
}
