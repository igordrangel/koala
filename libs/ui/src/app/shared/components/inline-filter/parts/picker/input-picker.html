<div
  class="flex flex-wrap justify-start items-center gap-1 border border-base-300 rounded-lg p-2 text-sm"
>
  @let editMode = selectedOptions().find((option) => option.editing);

  @for (item of selectedOptions(); track $index) {
    @if (item.editing) {
      <app-input-filter-edit [field]="item" (exitEditMode)="exitEditMode(item)" />
    } @else {
      <app-input-filter-chip
        [field]="item"
        (removeAction)="removeOption(item)"
        (click)="edit(item)"
      />
    }
  }

  @if (!editMode) {
    <div class="relative flex-1 w-fit" ngCombobox>
      <input
        #inputFilter
        class="relative flex-1 outline-0 w-full min-w-20 z-10 pl-1"
        type="search"
        [attr.list]="inlineFilterElementId"
        [placeholder]="placeholder()"
        [(ngModel)]="filter"
        (click)="triggerOptions.click()"
        (keyup.arrowdown)="triggerOptions.click()"
        ngComboboxInput
      />

      <app-dropdown class="absolute top-0 left-0 z-0">
        <button #triggerOptions type="button" class="flex-1 h-fit invisible" trigger>
          Filter Trigger
        </button>
        <div
          #filterOptions
          ngListbox
          class="p-1 w-50"
          (valuesChange)="chooseOption($event)"
          options
        >
          @for (option of filteredOptions(); track $index) {
            <li
              ngOption
              [value]="option"
              role="option"
              (mousedown)="chooseOption([option])"
              class="data-[active=true]:bg-neutral-800 rounded cursor-pointer"
            >
              <span>{{ option.label }}</span>
              <span class="empty:hidden">{{ option.hint }}</span>
            </li>
          }
        </div>
      </app-dropdown>
    </div>
  }
</div>
