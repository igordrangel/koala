@let anchorName = '--anchor-' + id;

<button
  #dropdownTrigger
  type="button"
  class="p-0! w-full"
  tabindex="0"
  role="button"
  [attr.popovertarget]="id"
  [style.anchor-name]="anchorName"
  [disabled]="disabled()"
  (click)="ajustPosition()"
>
  <ng-content select="[trigger]" />
</button>

@let isMenu = mode() === 'menu';
@let isOptions = mode() === 'options';

<div
  #dropdownContent
  tabindex="0"
  popover
  [id]="id"
  [style.position-anchor]="anchorName"
  class="dropdown menu p-0 bg-base-100 rounded-box shadow-sm border-2 border-base-300 rounded-md overflow-y-auto overflow-x-hidden w-auto"
  [class.mt-2]="isOptions"
  [class.min-w-[calc(100%-1rem)]!]="isMenu"
  [class.max-w-[calc(100vw-1rem)]!]="isMenu"
  [class.lg:min-w-auto!]="isMenu"
  [class.max-h-85]="isMenu"
  [style.min-width.px]="isOptions ? triggerWidth.value() : 0"
  [style.max-width.px]="isOptions ? triggerWidth.value() : 0"
>
  <ng-content select="[options]" />
</div>
